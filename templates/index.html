```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Plan Generator</title>
</head>
<body>
    <h1>FitBuddy</h1>
    <h2>AI Fitness Plan Generator</h2>
    <p>Build a plan that fits your routine.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/generate-workout" method="post">
        <label for="username">Name:</label>
        <input id="username" type="text" name="username"
               minlength="2" maxlength="100" required>
        <br><br>

        <label for="user_id">User ID:</label>
        <input id="user_id" type="text" name="user_id"
               minlength="2" maxlength="80" required>
        <br><br>

        <label for="age">Age:</label>
        <input id="age" type="number" name="age"
               min="13" max="100" required>
        <br><br>

        <label for="weight">Weight (kg):</label>
        <input id="weight" type="number" name="weight"
               min="1" max="500" step="0.1" required>
        <br><br>

        <label for="goal">Fitness Goal:</label>
        <select id="goal" name="goal" required>
            <option value="General Wellness">General Wellness</option>
            <option value="Weight Loss">Weight Loss</option>
            <option value="Muscle Gain">Muscle Gain</option>
            <option value="Flexibility">Flexibility</option>
            <option value="Strength">Strength</option>
        </select>
        <br><br>

        <label for="intensity">Intensity:</label>
        <select id="intensity" name="intensity" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
        <br><br>

        <button type="submit">Generate My Fitness Plan</button>
    </form>

    <hr>
    <a href="/feedback">Update Plan with Feedback</a>
    <br><br>
    <a href="/view-all-users">Admin View</a>
    <br><br>
    <a href="/docs">API Documentation</a>
</body>
</html>
```
