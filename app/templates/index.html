<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Plan Generator</title>
</head>
<body>
    <h1>FitBuddy - AI Fitness Plan Generator</h1>
    <p>Build a plan that fits your routine.</p>
    <form action="/generate-workout" method="post">
        <label>Name:</label>
        <input type="text" name="username" required>

        <label>User ID:</label>
        <input type="text" name="user_id" required>

        <label>Age:</label>
        <input type="number" name="age" min="13" required>

        <label>Weight (kg):</label>
        <input type="number" name="weight" step="0.1" min="1" required>

        <label>Fitness Goal:</label>
        <select name="goal">
            <option>General Wellness</option>
            <option>Weight Loss</option>
            <option>Muscle Gain</option>
            <option>Flexibility</option>
            <option>Strength</option>
        </select>

        <label>Intensity:</label>
        <select name="intensity">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>

        <button type="submit">Generate Workout Plan</button>
    </form>
</body>
</html>
